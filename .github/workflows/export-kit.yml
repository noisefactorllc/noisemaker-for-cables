name: Export kit

# Public repo: holds NO deploy credentials. Dispatches scaffold's
# export-kit-release.yml, which builds this repo's export kit at this exact
# SHA and ships it to kits.noisedeck.app. See scaffold
# docs/runbook/export-kits.md.
#
# Push gate (fast, no rendering): `npm run check` (vendor lock, unit suite,
# reproducible op bundle, package contents), the compatibility gate, and a
# no-diff check on the committed op. A green gate dispatches the kit release.
#
# Weekly and manual runs add everything that renders through software GL or
# downloads Cables Standalone: the browser suites (full-catalog parity sweep,
# pixel parity, state hygiene) and the native editor smoke on Windows x64,
# Intel macOS, macOS arm64, and Linux x64 for each declared Standalone
# version. A manual run dispatches the kit release only when every job passes;
# the weekly run never does.

on:
  workflow_dispatch:
  schedule:
    - cron: '41 7 * * 1'
  push:
    branches: [main]
    paths:
      - "export-kit/**"
      - ".github/workflows/export-kit.yml"
      # LICENSE is shipped kit content (vendored into LICENSES/): a relicense must auto-publish.
      - "LICENSE"
      - "Ops.Extension.Noisemaker/**"
      - "examples/noisemaker-program.cables"
      - "src/**"
      - "tools/**"
      - "test/**"
      - "parity/**"
      - "vendor-cache/**"
      - "vendor.lock.json"
      - "package*.json"
      - "playwright.config.*"

permissions: {}

concurrency:
  group: export-kit-${{ github.ref }}-${{ github.event_name == 'schedule' && 'weekly' || 'gate' }}
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node tools/compat-gate.mjs
      - run: git diff --exit-code -- Ops.Extension.Noisemaker

  browser:
    # Software-rendered (SwiftShader) parity is a weekly true-up, never a push gate.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Chromium and its system libraries
        run: |
          npx playwright install chromium
          # A stalled apt mirror can hold Playwright's apt step with no output
          # until the job timeout; bound each attempt and retry instead.
          for attempt in 1 2 3; do
            if sudo env "PATH=$PATH" timeout 300 npx playwright install-deps chromium; then exit 0; fi
            echo "::warning::playwright install-deps attempt $attempt failed or stalled"
          done
          echo "::error::playwright install-deps failed after 3 attempts"
          exit 1
      - run: npm run test:browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-${{ github.sha }}
          path: |
            playwright-report/
            test-results/

  standalone:
    # Downloads each Cables Standalone build and renders it through software GL
    # (Windows x64, Intel macOS, Linux x64) or, on macOS arm64, on the runner's
    # virtual Apple GPU through ANGLE Metal (tools/lib/graphics-flags.js);
    # weekly and manual only.
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel is the x86_64 image; macos-15 is Apple silicon (arm64).
        os: [windows-2025, macos-15-intel, macos-15, ubuntu-24.04]
        version: ['0.11.0', '0.11.3']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Download the declared Windows distribution
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CABLES_VERSION: ${{ matrix.version }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'cables.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'cables'
          Invoke-WebRequest "https://github.com/cables-gl/cables_electron/releases/download/v$env:CABLES_VERSION/cables-$env:CABLES_VERSION-win-x64.zip" -OutFile $archive
          Expand-Archive $archive $directory
          "CABLES_APP=$(Join-Path $directory 'cables.exe')" >> $env:GITHUB_ENV
      - name: Mount the declared macOS distribution for the runner's architecture
        if: runner.os == 'macOS'
        shell: bash
        env:
          CABLES_VERSION: ${{ matrix.version }}
        run: |
          case "$RUNNER_ARCH" in
            ARM64) DISTRIBUTION=arm64 MACHINE=arm64 ;;
            X64) DISTRIBUTION=x64 MACHINE=x86_64 ;;
            *) echo "::error::no declared macOS distribution for $RUNNER_ARCH"; exit 1 ;;
          esac
          # Native, not Rosetta: the leg qualifies its own architecture.
          test "$(uname -m)" = "$MACHINE"
          test "$(sysctl -in sysctl.proc_translated 2>/dev/null || true)" != 1
          curl --fail --location --retry 3 \
            "https://github.com/cables-gl/cables_electron/releases/download/v${CABLES_VERSION}/cables-${CABLES_VERSION}-mac-${DISTRIBUTION}.dmg" \
            --output "$RUNNER_TEMP/cables.dmg"
          hdiutil attach "$RUNNER_TEMP/cables.dmg" -readonly -nobrowse -mountpoint "$RUNNER_TEMP/cables-volume"
          app="$RUNNER_TEMP/cables-volume/cables.app/Contents/MacOS/cables"
          lipo -archs "$app"
          lipo -archs "$app" | tr ' ' '\n' | grep -qx "$MACHINE"
          echo "CABLES_APP=$app" >> "$GITHUB_ENV"
      - name: Extract the declared Linux distribution
        if: runner.os == 'Linux'
        shell: bash
        env:
          CABLES_VERSION: ${{ matrix.version }}
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/cables-gl/cables_electron/releases/download/v${CABLES_VERSION}/cables-${CABLES_VERSION}-linux-x64.AppImage" \
            --output "$RUNNER_TEMP/cables.AppImage"
          chmod +x "$RUNNER_TEMP/cables.AppImage"
          (cd "$RUNNER_TEMP" && ./cables.AppImage --appimage-extract > /dev/null)
          echo "CABLES_APP=$RUNNER_TEMP/squashfs-root/cables" >> "$GITHUB_ENV"
      - name: Exercise the native editor and saved-project lifecycle
        if: runner.os != 'Linux'
        run: npm run test:standalone
      - name: Exercise the native editor and saved-project lifecycle on a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:standalone
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: standalone-${{ matrix.os }}-${{ matrix.version }}-${{ github.sha }}
          path: test-report/
      - name: Detach the macOS distribution
        if: always() && runner.os == 'macOS'
        run: hdiutil detach "$RUNNER_TEMP/cables-volume" || true

  dispatch:
    needs: [runtime, browser, standalone]
    # A kit is released only after the full run (the weekly schedule or a
    # workflow_dispatch): pushes run the fast gate alone, which renders nothing,
    # so they publish nothing. Every job must pass, and a SHA that already
    # carries a kit tag is not released again (scaffold mints a new version for
    # every dispatch).
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'push' &&
      needs.runtime.result == 'success' && needs.browser.result == 'success' &&
      needs.standalone.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Skip a SHA that is already released
        id: released
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          tags=$(git ls-remote --tags "https://github.com/$REPO.git" 'refs/tags/kit-*')
          if printf '%s\n' "$tags" | awk '$2 ~ /\^\{\}$/ { print $1 }' | grep -qx "$SHA"; then
            echo "$SHA already carries a kit tag; nothing to release."
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint scaffold-dispatch token
        if: steps.released.outputs.released == 'false'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: 2959521
          private-key: ${{ secrets.EHSRE_APP_PRIVATE_KEY }}
          owner: noisefactorllc
          repositories: scaffold

      - name: Dispatch export-kit-release
        if: steps.released.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run export-kit-release.yml \
            --repo noisefactorllc/scaffold \
            --ref main \
            -f kit=cables \
            -f sha=${{ github.sha }}
